<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Jugadores | JPA Relaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        :root{--bg:#080f0b;--surface:#0e1a12;--surface2:#152019;--border:rgba(255,255,255,.07);--accent:#b5f03e;--white:#edf5ee;--muted:#5a7a62;--danger:#f05555;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
        nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;height:58px;background:rgba(8,15,11,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 2rem;}
        .brand{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:1px;color:var(--accent);text-decoration:none;margin-right:2.5rem;white-space:nowrap;}
        .nav-links{display:flex;align-items:center;gap:.2rem;}
        .nav-links a{color:var(--muted);text-decoration:none;font-size:.83rem;font-weight:500;padding:.38rem .75rem;border-radius:6px;transition:color .18s,background .18s;white-space:nowrap;}
        .nav-links a:hover,.nav-links a.active{color:var(--white);background:rgba(255,255,255,.06);}
        .nav-dropdown{position:relative;}
        .nav-dropdown>a{display:flex;align-items:center;gap:.3rem;cursor:pointer;}
        .nav-dropdown>a::after{content:'▾';font-size:.65rem;opacity:.5;transition:transform .2s;}
        .nav-dropdown:hover>a::after{transform:rotate(180deg);}
        .dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;min-width:170px;padding:.35rem 0;box-shadow:0 16px 40px rgba(0,0,0,.5);}
        .nav-dropdown:hover .dropdown-menu{display:block;}
        .dropdown-menu a{display:block;padding:.5rem 1rem;color:var(--muted);font-size:.82rem;white-space:nowrap;transition:background .15s,color .15s;background:none!important;}
        .dropdown-menu a:hover{background:rgba(255,255,255,.05)!important;color:var(--white);}
        .dropdown-menu .divider{border-top:1px solid var(--border);margin:.3rem 0;}
        .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.52rem 1.2rem;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;font-family:'Outfit',sans-serif;transition:all .18s;}
        .btn-primary{background:var(--accent);color:#080f0b;}
        .btn-primary:hover{background:#caff5a;}
        .btn-edit{background:transparent;color:var(--accent);border:1px solid rgba(181,240,62,.35);padding:.32rem .75rem;font-size:.78rem;}
        .btn-edit:hover{background:rgba(181,240,62,.1);}
        .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(240,85,85,.35);padding:.32rem .75rem;font-size:.78rem;}
        .btn-danger:hover{background:rgba(240,85,85,.1);}
        .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);}
        .btn-secondary:hover{color:var(--white);border-color:rgba(255,255,255,.2);}
        .container{max-width:980px;margin:2.5rem auto;padding:0 2rem;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
        .page-header h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;}
        .page-header h1 em{font-style:normal;color:var(--accent);}
        table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
        thead tr{background:rgba(0,0,0,.3);}
        th{padding:.85rem 1.2rem;text-align:left;font-size:.7rem;font-weight:600;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;}
        td{padding:.8rem 1.2rem;border-top:1px solid var(--border);font-size:.87rem;vertical-align:middle;}
        tr:hover td{background:rgba(255,255,255,.018);}
        .empty{text-align:center;color:var(--muted);padding:3.5rem;font-size:.9rem;}
        .badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 .5rem;border-radius:6px;font-size:.72rem;font-weight:700;background:rgba(181,240,62,.08);border:1px solid rgba(181,240,62,.2);color:var(--accent);}
        .rel-pill{display:inline-block;padding:.18rem .65rem;border-radius:20px;font-size:.75rem;background:rgba(181,240,62,.08);border:1px solid rgba(181,240,62,.2);color:var(--accent);}
        .muted-txt{color:var(--muted);font-size:.82rem;}
        .td-actions{display:flex;gap:.5rem;align-items:center;}
        .num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(181,240,62,.08);border:1px solid rgba(181,240,62,.2);color:var(--accent);font-weight:700;font-size:.82rem;}
    </style>
</head>
<body><nav>
    <a href="/" class="brand">⚽ JPA Relaciones</a>
    <div class="nav-links">
        <a th:href="@{/asociaciones/lista}">Asociaciones</a>
        <div class="nav-dropdown">
            <a href="#">Clubes</a>
            <div class="dropdown-menu">
                <a th:href="@{/clubes/lista}">📋 Ver lista</a>
                <div class="divider"></div>
                <a th:href="@{/clubes/nuevo}">➕ Nuevo club</a>
            </div>
        </div>
        <a th:href="@{/entrenadores/lista}">Entrenadores</a>
        <a th:href="@{/jugadores/lista}" class="active">Jugadores</a>
        <a th:href="@{/competiciones/lista}">Competiciones</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h1>⚽ <em>Jugadores</em></h1>
        <a th:href="@{/jugadores/nuevo}" class="btn btn-primary">+ Nuevo Jugador</a>
    </div>
    <table>
        <thead>
            <tr><th>#</th><th>Núm.</th><th>Nombre</th><th>Posición</th><th>Club</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(jugadores)}">
                <td colspan="6" class="empty">No hay jugadores registrados.</td>
            </tr>
            <tr th:each="j : ${jugadores}">
                <td><span class="badge" th:text="${j.id}">1</span></td>
                <td><span class="num" th:text="${j.numero}">10</span></td>
                <td th:text="${j.nombre + ' ' + j.apellido}">James Rodríguez</td>
                <td th:text="${j.posicion}">Mediocampista</td>
                <td>
                    <span th:if="${j.club != null}" th:text="${j.club.nombre}" class="rel-pill"></span>
                    <span th:if="${j.club == null}" class="muted-txt">Sin club</span>
                </td>
                <td class="td-actions">
                    <a th:href="@{/jugadores/editar/{id}(id=${j.id})}" class="btn btn-edit">Editar</a>
                    <form th:action="@{/jugadores/eliminar/{id}(id=${j.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este jugador?')">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
